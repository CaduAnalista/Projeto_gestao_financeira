<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Finanças da Família</title>
  <meta name="description" content="Controle de receitas, gastos, cartões e parcelas.">
  <meta name="theme-color" content="#2A1B12">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%232A1B12'/%3E%3Ctext x='32' y='42' font-family='Georgia' font-size='28' font-weight='700' text-anchor='middle' fill='%23D4AF5A'%3ER$%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=10">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <a class="brand" href="#inicio">
        <span class="brand-mark">R$</span>
        <span class="brand-text"><strong>Finanças</strong><small>da Família</small></span>
      </a>
      <nav class="nav" aria-label="Menu principal">
        <a href="#inicio" data-page="inicio">
          <svg viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 1 1 3 3L7 19l-4 1 1-4z"/></svg>
          <span>Cadastro</span>
        </a>
        <a href="#cartoes" data-page="cartoes">
          <svg viewBox="0 0 24 24"><rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="M2.5 10h19M6.5 15h4"/></svg>
          <span>Cartões</span>
        </a>
        <a href="#analise" data-page="analise">
          <svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
          <span>Análise</span>
        </a>
        <a href="#config" data-page="config">
          <svg viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>
          <span>Ajustes</span>
        </a>
      </nav>
      <div class="sidebar-foot">
        <button class="theme-btn" id="btnMenu" type="button" title="Recolher menu" aria-expanded="true">
          <svg viewBox="0 0 24 24"><path d="m11 17-5-5 5-5M18 17l-5-5 5-5"/></svg>
          <span>Recolher menu</span>
        </button>
        <button class="theme-btn" id="btnTema" type="button" title="Alternar tema claro/escuro">
          <svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <span>Tema</span>
        </button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="topbar-title">
          <h1 id="pageTitle">Início</h1>
          <p id="pageSub"></p>
        </div>
        <div class="topbar-actions" id="topActions"></div>
      </header>
      <div id="view" class="view"></div>
    </main>
  </div>

  <button class="fab" id="fab" type="button" aria-label="Novo lançamento">
    <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
  </button>

  <div id="modalRoot"></div>
  <div id="toastRoot" class="toast-root" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="data.js?v=11"></script>
  <script src="ui.js?v=11"></script>
  <script src="form.js?v=11"></script>
  <script src="inicio.js?v=11"></script>
  <script src="cartoes.js?v=11"></script>
  <script src="analise.js?v=11"></script>
  <script src="config.js?v=11"></script>
  <script src="app.js?v=11"></script>
</body>
</html>
